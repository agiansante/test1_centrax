<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LLM Chat Test</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="chat-panel" aria-label="Chat con LLM">
        <header class="chat-header">
          <div>
            <p class="eyebrow">Progetto test</p>
            <h1>LLM Chat</h1>
          </div>
          <span class="status" id="status">Pronta</span>
        </header>

        <div class="messages" id="messages" aria-live="polite">
          <article class="message assistant">
            <p>Ciao, sono pronta. Scrivimi una domanda e la mando al modello.</p>
          </article>
        </div>

        <form class="composer" id="chat-form">
          <div class="attachment-bar" id="attachment-bar" hidden></div>
          <textarea
            id="prompt"
            name="prompt"
            rows="1"
            placeholder="Scrivi un messaggio..."
            autocomplete="off"
          ></textarea>
          <input id="file-input" type="file" multiple hidden>
          <button class="icon-button" id="attach-button" type="button" aria-label="Carica file" title="Carica file">
            <span aria-hidden="true">+</span>
          </button>
          <button type="submit" aria-label="Invia messaggio">
            <span>Invia</span>
          </button>
        </form>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
